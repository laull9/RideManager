[database]
connection_string = "Host=localhost;Port=5432;Database=ridemanager;Username=ridemanager;Password=ridemanager"

[models]
backend = "onnx"
directory = "models"

[[cameras]]
id = "CAM_FRONT"
enabled = true
device = "/dev/video0"
model = "yolo26n.onnx"
width = 1280
height = 720
input_width = 640
input_height = 640
fps = 30
confidence_threshold = 0.35

[[cameras]]
id = "CAM_FACE"
enabled = false
device = "/dev/video1"
model = "face-fatigue.onnx"
width = 640
height = 480
input_width = 640
input_height = 480
fps = 30
confidence_threshold = 0.50

[[cameras]]
id = "CAM_BACK"
enabled = false
device = "/dev/video2"
model = "yolo26n.onnx"
width = 1280
height = 720
input_width = 640
input_height = 640
fps = 30
confidence_threshold = 0.35

[sensors.radar]
enabled = true
transport = "bluetooth"
address = ""
device_name = "EVADAR-C6"
service_uuid = "0000ad01-0000-1000-8000-00805f9b34fb"
notify_uuid = "0000ad02-0000-1000-8000-00805f9b34fb"
config_uuid = "0000ad03-0000-1000-8000-00805f9b34fb"
health_uuid = "0000ad04-0000-1000-8000-00805f9b34fb"
match_by_service = true
subscribe_health = true
scan_timeout_seconds = 12.0
services_timeout_seconds = 10.0
reconnect_delay_seconds = 2.0

[sensors.gyro]
enabled = false
transport = "serial"
address = "/dev/ttyS0"

[actuators.brake]
enabled = false

[actuators.speaker]
enabled = false
